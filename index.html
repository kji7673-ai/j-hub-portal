    <!-- Bottom Floating Navigation Bar -->
    <style>
      .bottom-nav {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translate(-50%, 20px);
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        z-index: 1000;
      }
      body.ui-active .bottom-nav {
        transform: translate(-50%, 0);
        opacity: 1;
        pointer-events: auto;
        display: flex;
        background: rgba(250, 250, 252, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 9999px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        padding: 6px 8px;
        gap: 4px;
        z-index: 1500;
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      .bottom-nav button {
        background: transparent;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: 10px; border-radius: 50%; width: 44px; height: 44px;
        font-size: 14px;
        font-weight: 500;

        border-radius: 9999px;
        cursor: pointer;
        transition: background 0.2s;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .bottom-nav button:hover,
      .bottom-nav button:active {
        background: rgba(0, 0, 0, 0.08);
      }
      .bottom-nav button svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;

    <div
      id="resume-modal"
      class="resume-modal"
      style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center;"
    >
      <div class="modal-content-box" style="background: #1d1d1f; border: 1px solid #333; padding: 40px; border-radius: 18px; max-width: 400px; width: 90%; text-align: center;">
        <h3 style="color: #fff; font-size: 21px; margin-bottom: 12px; font-weight: 600;">이어보기</h3>
        <p style="color: #aaa; font-size: 15px; margin-bottom: 30px; line-height: 1.5;" id="resume-text">
          마지막으로 읽으신 페이지부터<br>이어서 보시겠습니까?
        </p>
        <div style="display: flex; gap: 12px; justify-content: center;">
          <button
            style="background: #333; color: #fff; border: none; padding: 12px 24px; border-radius: 24px; font-size: 15px; cursor: pointer; flex: 1;"
            onclick="startFromBeginning()"
          >
            처음부터
          </button>
          <button
            style="background: #0066cc; color: #fff; border: none; padding: 12px 24px; border-radius: 24px; font-size: 15px; font-weight: 600; cursor: pointer; flex: 1;"
            onclick="resumeReading()"
          >
            이어보기
          </button>
        </div>
      </div>
    </div>

    <div
      id="bookmark-modal"
      class="bookmark-modal"
      onclick="if (event.target === this) this.style.display = 'none';"
    >
      <div class="modal-content-box">
        <h3>📑 내 책갈피</h3>
        <div
          id="bookmark-list-container"
          style="max-height: 300px; overflow-y: auto; margin-bottom: 15px"
        ></div>
        <div style="text-align: right">
          <button
            class="floating-btn"
            onclick="
              document.getElementById('bookmark-modal').style.display = 'none'
            "
            style="
              background: rgba(255, 255, 255, 0.9);
              border: 1px solid #e0e0e0;
              border-radius: 20px;
              padding: 10px; border-radius: 50%; width: 44px; height: 44px;
              cursor: pointer;
            "
          >
            닫기
          </button>
        </div>
      </div>
    </div>

    <div
      id="feedback-modal"
      class="feedback-modal"
      onclick="if (event.target === this) this.style.display = 'none';"
    >
      <div class="modal-content-box">
        <h3>📝 소감 보내기</h3>
        <p style="font-size: 13px; color: #666; margin-bottom: 15px">
          작가에게 책을 읽은 소감이나 피드백을 전달해 주세요!
        </p>
        <textarea
          id="feedback-text"
          style="
            width: 100%;
            height: 120px;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: none;
            font-family: inherit;
            margin-bottom: 15px;
            font-size: 14px;
          "
          placeholder="여기에 소감을 작성해 주세요..."
        ></textarea>
        <div style="display: flex; justify-content: space-between">
          <button
            class="floating-btn"
            onclick="
              document.getElementById('feedback-modal').style.display = 'none'
            "
            style="
              background: rgba(255, 255, 255, 0.9);
              border: 1px solid #e0e0e0;
              border-radius: 20px;
              padding: 10px; border-radius: 50%; width: 44px; height: 44px;
              cursor: pointer;
            "
          >
            취소
          </button>
          <button
            class="floating-btn"
            style="
              background: #1d1d1f;
              color: #fff;
              border: none;
              border-radius: 20px;
              padding: 10px; border-radius: 50%; width: 44px; height: 44px;
              cursor: pointer;
            "
            onclick="sendFeedbackEmail()"
          >
            메일 앱으로 전송
          </button>
        </div>
      </div>
    </div>
